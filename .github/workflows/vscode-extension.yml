name: VSCode Extension - Build and Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'vscode-kotlin-debug/**'
      - 'src/**'
      - 'build.gradle.kts'
  pull_request:
    branches:
      - main
    paths:
      - 'vscode-kotlin-debug/**'
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Debugger JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build Fat JAR
        run: ./gradlew fatJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-debugger-jar
          path: build/libs/kotlin-debugger-*-all.jar
          retention-days: 7

  build-extension:
    name: Build VSCode Extension
    needs: build-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: kotlin-debugger-jar
          path: ./vscode-kotlin-debug/

      - name: Rename JAR file
        run: |
          cd vscode-kotlin-debug
          mv kotlin-debugger-*-all.jar kotlin-debugger.jar
          ls -la kotlin-debugger.jar

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-kotlin-debug/package-lock.json

      - name: Install dependencies
        working-directory: ./vscode-kotlin-debug
        run: npm ci || npm install

      - name: Compile TypeScript
        working-directory: ./vscode-kotlin-debug
        run: npm run compile

      - name: Package extension
        working-directory: ./vscode-kotlin-debug
        run: |
          mkdir -p dist
          # 使用 docs/VSCODE_GUIDE.md 作为插件市场 README
          cp ../docs/VSCODE_GUIDE.md README.md
          npx vsce package --out ./dist/

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-kotlin-debug/dist/*.vsix
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-extension
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: kotlin-debugger-jar
          path: ./artifacts/

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: ./artifacts/

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          files: |
            artifacts/*.jar
            artifacts/*.vsix
            release/kotlin-debugger.sh
            release/kotlin-debugger.bat
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
